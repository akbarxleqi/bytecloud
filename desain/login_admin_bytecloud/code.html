<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Bytecloud Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#24a1de",
                        "on-primary-fixed-variant": "#004c6d",
                        "on-tertiary": "#ffffff",
                        "background": "#f7f9fb",
                        "inverse-primary": "#86cfff",
                        "secondary-container": "#d5e3fd",
                        "surface-tint": "#00658f",
                        "secondary": "#515f74",
                        "on-primary-fixed": "#001e2e",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "outline": "#6f7881",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-container": "#00344c",
                        "error": "#ba1a1a",
                        "tertiary-container": "#00a1e4",
                        "inverse-surface": "#2d3133",
                        "secondary-fixed-dim": "#b9c7e0",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-fixed-dim": "#89ceff",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bec8d1",
                        "primary": "#00658f",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#3e4850",
                        "on-secondary-fixed-variant": "#3a485c",
                        "on-secondary-fixed": "#0d1c2f",
                        "primary-fixed-dim": "#86cfff",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "surface": "#f7f9fb",
                        "tertiary": "#006591",
                        "on-tertiary-fixed": "#001e2f",
                        "primary-fixed": "#c8e6ff",
                        "secondary-fixed": "#d5e3fd",
                        "on-error": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed": "#c9e6ff",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-container": "#57657b",
                        "inverse-on-surface": "#eff1f3",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eceef0",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#00334c",
                        "surface-dim": "#d8dadc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "card-padding": "20px",
                        "sidebar-width": "260px",
                        "margin-page": "32px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Geist"],
                        "label-md": ["Geist"],
                        "headline-sm": ["Geist"],
                        "label-sm": ["Geist"],
                        "headline-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-sm": ["18px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Geist', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(at 0% 0%, rgba(36, 161, 222, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 101, 143, 0.03) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col items-center justify-center p-gutter selection:bg-primary-container selection:text-on-primary-container">
<!-- Login Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Identity Header -->
<header class="mb-10 text-center">
<div class="mb-4 flex justify-center">
<div class="h-16 w-16 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="cloud_done" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-1">Bytecloud</h1>
<p class="font-body-md text-body-md text-secondary">Enterprise Admin Console</p>
</header>
<!-- Login Card -->
<section class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-xl shadow-on-background/5 p-10 overflow-hidden">
<form action="#" class="space-y-6" method="POST">
<!-- Email/Username Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="identifier">Email or Telegram Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="identifier" name="identifier" placeholder="user@bytecloud.io or @username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & State -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 font-body-md text-body-md text-secondary cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant active:scale-[0.98] text-on-primary py-3.5 px-4 rounded-lg font-headline-sm text-headline-sm transition-all shadow-md shadow-primary/10 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- SSO / Alternative Options -->
<div class="mt-8 pt-8 border-t border-outline-variant/30">
<p class="text-center font-label-md text-label-md text-secondary mb-4 uppercase tracking-wider">Or continue with</p>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-surface-container border border-outline-variant rounded-lg hover:bg-surface-container-high transition-colors text-on-surface font-label-md">
<span class="material-symbols-outlined text-[20px]" data-icon="key">key</span>
<span>Passkey</span>
</button>
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-surface-container border border-outline-variant rounded-lg hover:bg-surface-container-high transition-colors text-on-surface font-label-md">
<span class="material-symbols-outlined text-[20px] text-[#24A1DE]" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
<span>Telegram</span>
</button>
</div>
</div>
</section>
<!-- Footer Note -->
<footer class="mt-12 flex flex-col items-center gap-4">
<p class="font-label-md text-label-md text-secondary/60 flex items-center gap-1.5">
                Powered by 
                <span class="font-bold text-on-surface-variant">Laravel</span>
<span class="h-3 w-[1px] bg-outline-variant/50"></span>
<span class="font-bold text-on-surface-variant">Filament</span>
</p>
<div class="flex gap-6">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</footer>
</main>
<!-- Decorative Elements (Subtle) -->
<div class="fixed top-0 right-0 -z-10 p-gutter opacity-20 hidden lg:block">
<div class="h-32 w-32 border-[16px] border-primary/10 rounded-full blur-xl"></div>
</div>
<div class="fixed bottom-0 left-0 -z-10 p-gutter opacity-20 hidden lg:block">
<div class="h-48 w-48 border-[24px] border-primary-container/10 rounded-full blur-2xl"></div>
</div>
</body></html>
